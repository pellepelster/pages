groups:
  - name: root
    direction: horizontal
    groups:
      - name: Operations, Deployment & Lifecycle
        direction: vertical
        components:
          - name: Playbooks
            logo: logos/list-ol.svg
            info: |
              Playbooks are a crucial part of every solution and provide detailed procedures for
              scenarios like disaster recovery or secret rotation during emergencies. They also
              provide information for general operation and maintenance.
            selected: How I can prepare my on-call team with appropriate playbooks for operational challenges
          - name: Fire Drills
            logo: logos/fire-extinguisher.svg
            info: |
              Regular exercises ensure that crucial steps that are seldom used still work as
              intended, and that developers are comfortable with executing them.
            selected: |
              How to use simulated outages and service degradations to train my on-call team and spread operational confidence
          - name: Support
            logo: logos/phone.svg
            info: |
              In the event of critical errors, such as system crashes or data loss, German and
              English emergency support is available via email, phone, or chat.
            selected: |
              How to get live-assistance when problems appear or services are interrupted.
          - name: Environments
            logo: logos/layer-group.svg
            info: |
              Multi-environment support is a first-class citizen. It can be used to support
              your application lifecycle and to provide different test environments.
            selected: |
              How to implement multiple environments to support different development stages.
          - name: Bootstrapping
            logo: logos/terminal.svg
            info: |
              Deletion and bootstrapping of environments is systematically tested to ensure
              there are no hidden cyclic dependencies in the infrastructure setup. This method
              also confirms that the code which is only executed during the initial setup
              continues to function correctly.
            selected: |
              How to ensure the my infrastructure is always black-start ready so I can deal with provider outages.
          - name: OS Updates
            logo: logos/arrows-rotate.svg
            info: |
              Regular OS and software updates are automated via Renovate integration,
              ensuring all dependencies stay current and vulnerabilities are patched promptly.
            selected: |
              How to keep my infrastructure and software stack always up-to-date.

          - name: Disaster Recovery
            logo: logos/fire.svg
            info: |
              Restoring environments from backups is tested regularly and is included in both
              the playbooks and developer briefings. All components are designed in a way, that
              the entire environment can be destroyed at any time, and then fully rebuilt from
              the backups.
            selected: |
              How to build and test environments that survive outages and attacks and can be restored from external backups.

      - direction: vertical
        groups:
          - name: Logging & Monitoring
            direction: vertical
            components:
              - name: Grafana
                logo: logos/grafana.svg
                info: |
                  Grafana dashboards provide real-time visibility into application and
                  infrastructure metrics, with pre-built panels for common Solidblocks
                  components and support for custom datasources.
              - name: Elastic.co
                logo: logos/elastic.svg
                info: |
                  Elastic.co also serves as a metrics backend, unifying logs and
                  metrics in a single platform for correlated observability across
                  the entire stack.
              - name: Datadog
                logo: logos/elastic.svg
          - name: Security & Data Safety
            direction: vertical
            components:
              - name: Encryption
                logo: logos/lock.svg
                info: |
                  All off-cloud backups are encrypted by default. Data at rest and in transit
                  is protected using industry-standard encryption practices.
              - name: Secret Rotation
                logo: logos/key.svg
                info: |
                  Credentials and secrets are auto-generated with strong entropy and stored in
                  dedicated secret providers. Rotation procedures are documented in playbooks
                  and regularly exercised in fire drills.
              - name: CVE Scanning
                logo: logos/shield-halved.svg
                info: |
                  Automated CVE scanning is performed using Software Bill of Materials (SBOM)
                  analysis, providing continuous visibility into known vulnerabilities across
                  all components in the stack.
              - name: IAM / IDP
                logo: logos/user-shield.svg
                info: |
                  Identity and access management is provided via Keycloak and HashiCorp Vault
                  integration, enabling fine-grained access control and centralised
                  authentication across all services.

