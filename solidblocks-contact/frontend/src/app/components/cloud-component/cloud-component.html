@if (component().type !== 'unknown') {
  <span class="component-title">{{ component().name }}</span>
}
@if (component().logo) {
  <img class="component-logo" [src]="logoUrl()" [alt]="component().name" />
}
@if (effectiveInfo() && tooltipVisible()) {
  <div class="tooltip" [style]="tooltipStyle()">{{ effectiveInfo() }}</div>
}
<span class="turned-indicator">?</span>
