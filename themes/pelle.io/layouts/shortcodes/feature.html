<div class="feature col d-flex flex-column">

    <h3 class="fs-2 text-body-emphasis align-middle">
        <i class="fas {{ .Get "iconClasses" }}"></i>
        {{ .Get "title" }}
    </h3>
    <p>
        {{ .Inner }}
    </p>
    {{- with .Get "screenshot" }}
    {{- partial "feature-screenshot.html" (dict "file" . "title" ($.Get "title") "page" $.Page) }}
    {{- end }}
</div>
