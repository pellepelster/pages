[tools]
hugo = "0.123.8"
github-cli = "2.89.0"
go="1.26.0"
node = "22"

[env]
SITES="pelle.io solidblocks.de"

[tasks.build]
description = "Build all sites"
run = """
#!/bin/env bash

for site in ${SITES}; do
  (
    cd "${site}"
    hugo --themesDir "{{config_root}}/themes" --destination "{{config_root}}/output/${site}"
  )
done
"""

[tasks.serve]
description = "Serve a site locally"
usage = """
arg "<site>"
"""
run = """
#!/bin/env bash

site="${usage_site}"
(
    cd "${site}"
    hugo --themesDir "{{config_root}}/themes" --destination "{{config_root}}/output/${site}" serve --buildDrafts --verbose --disableFastRender
)
"""

[tasks.deploy]
description = "Deploy all sites to S3"
run = """
#!/bin/env bash
export S3_HOST="${S3_HOST:-$(pass pelle/default/public/endpoints/s3_host)}"

export PELLE_IO_ACCESS_KEY="${PELLE_IO_ACCESS_KEY:-$(pass pelle/default/public/pelle.io/admin/access_key)}"
export PELLE_IO_SECRET_KEY="${PELLE_IO_SECRET_KEY:-$(pass pelle/default/public/pelle.io/admin/secret_key)}"

export SOLIDBLOCKS_DE_ACCESS_KEY="${SOLIDBLOCKS_DE_ACCESS_KEY:-$(pass pelle/default/public/solidblocks.de/admin/access_key)}"
export SOLIDBLOCKS_DE_SECRET_KEY="${SOLIDBLOCKS_DE_SECRET_KEY:-$(pass pelle/default/public/solidblocks.de/admin/secret_key)}"

s3cmd --host-bucket ${S3_HOST} --host ${S3_HOST} \
  --access_key ${PELLE_IO_ACCESS_KEY} \
  --secret_key ${PELLE_IO_SECRET_KEY} \
  sync --no-mime-magic --guess-mime-type output/pelle.io/* "s3://pelle.io"

s3cmd --host-bucket ${S3_HOST} --host ${S3_HOST} \
  --access_key ${SOLIDBLOCKS_DE_ACCESS_KEY} \
  --secret_key ${SOLIDBLOCKS_DE_SECRET_KEY} \
  sync --no-mime-magic --guess-mime-type output/solidblocks.de/* "s3://solidblocks.de"
"""

[tasks.github-update-secrets]
run = """
#!/bin/env bash

export GITHUB_TOKEN="${GITHUB_TOKEN:-$(pass github/pellepelster/pat/admin)}"

gh secret set PELLE_IO_ACCESS_KEY --body "$(pass pelle/default/public/pelle.io/admin/access_key)" --repo pellepelster/pages
gh secret set PELLE_IO_SECRET_KEY --body "$(pass pelle/default/public/pelle.io/admin/secret_key)" --repo pellepelster/pages
gh secret set SOLIDBLOCKS_DE_ACCESS_KEY --body "$(pass pelle/default/public/solidblocks.de/admin/access_key)" --repo pellepelster/pages
gh secret set SOLIDBLOCKS_DE_SECRET_KEY --body "$(pass pelle/default/public/solidblocks.de/admin/secret_key)" --repo pellepelster/pages
gh secret set S3_HOST --body "$(pass pelle/default/public/endpoints/s3_host)" --repo pellepelster/pages
"""

[tasks.generate-feature-gifs]
run = """
#!/bin/env bash

for cast in ${HOME}/git/solidblocks/doc/content/cloud/casts/*.cast; do
  echo "converting '$(basename ${cast})'"
  docker run -ti  -v ${HOME}/git/solidblocks/doc/content/cloud/casts/:/casts -v $(pwd)/solidblocks.de/static/features/:/output  ghcr.io/asciinema/agg:1.7.0 --speed 5 --theme solarized-light /casts/$(basename ${cast}) /output/$(basename ${cast}).gif
  gifsicle --colors 256 --scale 0.7 $(pwd)/solidblocks.de/static/features/$(basename ${cast}).gif > $(pwd)/solidblocks.de/static/features/$(basename ${cast})_scaled.gif
done

"""

[tasks."contact:frontend:run"]
description = "Start Angular dev server"
run = "cd solidlocks-contact/frontend && npx ng serve"

[tasks."contact:backend:run"]
description = "Start Ktor backend"
run = "cd solidlocks-contact/backend && ./gradlew run"

[tasks."contact:docker:build"]
description = "Build Docker image with frontend and backend"
run = "cd solidlocks-contact && docker build -t solidlocks-contact ."

[tasks."contact:docker:run"]
description = "Run the Docker image locally on port 8080"
run = "cd solidlocks-contact && docker run --rm -p 8080:8080 contact"

[tasks."contact:format"]
description = "Format and lint-fix all contact frontend and backend code"
depends = ["contact:frontend:format", "contact:backend:format"]

[tasks."contact:frontend:format"]
description = "Format frontend TypeScript, HTML and SCSS with Prettier; fix ESLint and Stylelint issues"
run = """
cd solidlocks-contact/frontend
npx prettier --write "src/**/*.{ts,html,scss}"
npx eslint src --fix
npx stylelint "src/**/*.scss" --fix
"""

[tasks."contact:backend:format"]
description = "Format Kotlin sources with Spotless (ktfmt)"
run = "cd solidlocks-contact/backend && ./gradlew spotlessApply"
