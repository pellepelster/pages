[tools]
github-cli = "2.89.0"
go = "1.26.0"
node = "22"
"ubi:gohugoio/hugo" = { version = "0.164.0", matching = "extended_withdeploy" }

[settings]
env_shell_expand = true

[env]
SITES = "pelle.io"

[tasks."sites:build:pelle.io"]
dir="pelle.io"
run = "hugo --themesDir {{config_root}}/themes"

[tasks."sites:serve"]
usage = """
arg "<site>"
"""
run = """
#!/bin/env bash

site="${usage_site}"
cd "${site}"
hugo --themesDir "{{config_root}}/themes" serve --buildDrafts --disableFastRender
"""

[tasks."sites:deploy:pelle.io"]
dir="pelle.io"
run = """
export AWS_ACCESS_KEY_ID="${PELLE_IO_ACCESS_KEY:-$(pass blcks/pelle/pelle-io/access_key_id)}"
export AWS_SECRET_ACCESS_KEY="${PELLE_IO_SECRET_KEY:-$(pass blcks/pelle/pelle-io/secret_key)}"
hugo deploy --themesDir {{config_root}}/themes --target pelle-default-pelle-io
"""

[tasks."sites:build-and-deploy"]
dir="pelle.io"
run = """
mise sites:build:*
mise sites:deploy:*
"""
